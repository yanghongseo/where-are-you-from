<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>st.007</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 0;
      background: white;
      color: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 32px;
      text-align: center;
    }

    .station-number {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 22px;
    }

    .object-image {
      width: 100%;
      max-width: 310px;
      display: block;
      margin: 0 auto 28px;
    }

    .object-title {
      font-size: 36px;
      font-weight: 800;
      margin: 0 0 16px;
      letter-spacing: 2px;
    }

    .divider {
      width: 100%;
      height: 2px;
      background: #111;
      margin: 0 auto 46px;
    }

    .info {
      width: 100%;
      text-align: left;
    }

    .info-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 32px;
      margin-bottom: 34px;
      font-size: 23px;
      line-height: 1.45;
    }

    .label {
      font-weight: 800;
    }

    .value {
      font-weight: 400;
      word-break: keep-all;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="station-number">st.007</h1>

    <img class="object-image" src="stone7.jpeg" alt="JIP확-331-3 현무암 이미지" />

    <h2 class="object-title">JIP확-331-3</h2>

    <div class="divider"></div>

    <section class="info">
      <div class="info-row">
        <div class="label">채집지</div>
        <div class="value">제주 국제 공항 기념품샵 구매 (16000원)</div>
      </div>

      <div class="info-row">
        <div class="label">특징</div>
        <div class="value">연회색, 다공성, 가루가 많이 떨어짐. 내부에 큰 구멍.</div>
      </div>

      <div class="info-row">
        <div class="label">수집장소</div>
        <div class="value">제주 천연석 수집 (판매처 확인)</div>
      </div>

      <div class="info-row">
        <div class="label">크기</div>
        <div class="value">7×6.8×6.2cm</div>
      </div>

      <div class="info-row">
        <div class="label">무게</div>
        <div class="value">0.37kg</div>
      </div>

      <div class="info-row">
        <div class="label">분류</div>
        <div class="value">현무암</div>
      </div>

      <div class="info-row">
        <div class="label">입수일</div>
        <div class="value">2026.03.31</div>
      </div>

      <div class="info-row">
        <div class="label">비고</div>
        <div class="value">제주 천연 현무암 반출이 불법인 관계로 구매함. 화분용이라 밑면이 평평하게 다듬어져 있음.</div>
      </div>
    </section>
  </main>
</body>
</html>
