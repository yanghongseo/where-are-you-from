<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>st.004</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 0;
      background: white;
      color: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 32px;
      text-align: center;
    }

    .station-number {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 22px;
    }

    .object-image {
      width: 100%;
      max-width: 310px;
      display: block;
      margin: 0 auto 28px;
    }

    .object-title {
      font-size: 36px;
      font-weight: 800;
      margin: 0 0 16px;
      letter-spacing: 2px;
    }

    .divider {
      width: 100%;
      height: 2px;
      background: #111;
      margin: 0 auto 46px;
    }

    .info {
      width: 100%;
      text-align: left;
    }

    .info-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 32px;
      margin-bottom: 34px;
      font-size: 23px;
      line-height: 1.45;
    }

    .label {
      font-weight: 800;
    }

    .value {
      font-weight: 400;
      word-break: keep-all;
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="station-number">st.004</h1>

    <img class="object-image" src="stone4.jpeg" alt="CP부-501 현무암 이미지" />

    <h2 class="object-title">CP부-501</h2>

    <div class="divider"></div>

    <section class="info">
      <div class="info-row">
        <div class="label">채집지</div>
        <div class="value">쿠팡 구매 (2300원)</div>
      </div>

      <div class="info-row">
        <div class="label">특징</div>
        <div class="value">흑색, 다공성, 단단함</div>
      </div>

      <div class="info-row">
        <div class="label">수집장소</div>
        <div class="value">비공개. 판매처에 연락요망</div>
      </div>

      <div class="info-row">
        <div class="label">크기</div>
        <div class="value">15×10×5cm</div>
      </div>

      <div class="info-row">
        <div class="label">무게</div>
        <div class="value">0.68kg</div>
      </div>

      <div class="info-row">
        <div class="label">분류</div>
        <div class="value">현무암</div>
      </div>

      <div class="info-row">
        <div class="label">입수일</div>
        <div class="value">2026.05.01</div>
      </div>

      <div class="info-row">
        <div class="label">비고</div>
        <div class="value">원산지 확인 불가. 천연 채집으로 추정중.</div>
      </div>
    </section>
  </main>
</body>
</html>
